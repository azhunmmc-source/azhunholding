<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Azhunholding - Admin Panel</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // CMS yüklənməzdən əvvəl Identity-ni məcburi olaraq qeyd edirik
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // ƏN VACİB HİSSƏ: CMS-ə saytın ünvanını birbaşa deyirik
    window.netlifyIdentityWidget = window.netlifyIdentity;
    
    // Əgər CMS yenə tapmasa, ona kömək edirik
    (function() {
      var interval = setInterval(function() {
        if (window.netlifyIdentity) {
          window.netlifyIdentityWidget = window.netlifyIdentity;
          if (window.CMS) {
            clearInterval(interval);
          }
        }
      }, 100);
    })();
  </script>
</body>
</html>
