<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZHUN - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap');
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Login Səhifəsi -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">AZHUN</h1>
                <p class="text-slate-500 mt-2 text-sm uppercase tracking-widest font-semibold">Admin Girişi</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="admin@azhunholding.com" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Şifrə</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-all shadow-lg active:scale-[0.98]">Daxil Ol</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden font-medium"></p>
        </div>
    </div>

    <!-- Dashboard (Daxil olandan sonra) -->
    <div id="admin-section" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col">
            <h2 class="text-xl font-bold mb-10 tracking-widest text-center md:text-left">AZHUN</h2>
            <nav class="space-y-2 flex-1">
                <button onclick="showTab('content')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 transition-all font-medium">Məzmun İdarəetməsi</button>
                <button onclick="showTab('products')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 transition-all font-medium">Məhsullar</button>
                <button onclick="showTab('moderators')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 transition-all font-medium">Moderatorlar</button>
            </nav>
            <button id="logout-btn" class="mt-10 md:mt-auto px-4 py-3 text-slate-400 hover:text-white transition-all text-left font-medium">
                <i class="fas fa-sign-out-alt mr-2"></i> Çıxış Et
            </button>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                <h2 id="tab-title" class="text-2xl md:text-3xl font-bold text-slate-800">Məzmun İdarəetməsi</h2>
                <span id="user-info" class="text-xs font-bold text-slate-500 bg-slate-200 px-4 py-2 rounded-full">Moderator</span>
            </header>

            <!-- Content Tab -->
            <div id="content-tab" class="space-y-6 max-w-4xl">
                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="text-lg font-bold text-slate-800 border-b pb-2 mb-4">Ana Səhifə (Hero)</h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Ana Başlıq</label>
                            <input type="text" id="db-hero-title" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Alt Başlıq</label>
                            <textarea id="db-hero-subtitle" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="text-lg font-bold text-slate-800 border-b pb-2 mb-4">Haqqımızda</h3>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Bölmə Başlığı</label>
                        <input type="text" id="db-about-title" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Əsas Mətn</label>
                        <textarea id="db-about-text-1" rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                </div>

                <button id="save-content" class="w-full md:w-auto bg-blue-600 text-white font-bold px-8 py-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">Dəyişiklikləri Yadda Saxla</button>
            </div>

            <!-- Products Tab -->
            <div id="products-tab" class="hidden space-y-6 max-w-4xl">
                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-800 mb-6">Yeni Məhsul Əlavə Et</h3>
                    <div class="space-y-4">
                        <input type="hidden" id="product-id">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Məhsulun Adı</label>
                            <input type="text" id="prod-name" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Təsviri</label>
                            <textarea id="prod-desc" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Şəkil URL</label>
                            <input type="text" id="prod-image" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div class="flex gap-2">
                            <button id="save-product" class="bg-blue-600 text-white font-bold px-8 py-3 rounded-xl hover:bg-blue-700 transition-all">Yadda Saxla</button>
                            <button id="cancel-edit" class="hidden bg-slate-200 text-slate-700 font-bold px-8 py-3 rounded-xl hover:bg-slate-300 transition-all">Ləğv Et</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-800 mb-6">Mövcud Məhsullar</h3>
                    <div id="products-list" class="grid grid-cols-1 gap-4">
                        <p class="text-slate-400 italic text-sm">Yüklənir...</p>
                    </div>
                </div>
            </div>

            <!-- Moderators Tab -->
            <div id="moderators-tab" class="hidden space-y-6 max-w-4xl">
                <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-800 mb-6">Yeni Moderator Əlavə Et</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
                            <input type="email" id="new-mod-email" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Şifrə</label>
                            <input type="password" id="new-mod-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <button id="add-mod" class="mt-6 bg-slate-900 text-white font-bold px-8 py-3 rounded-xl hover:bg-slate-800 transition-all">Moderator Yarat</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyALBZ03IAWaWvHmVX-9zF2GVbIeBWmV_OA",
            authDomain: "azhunholding-20283.firebaseapp.com",
            databaseURL: "https://azhunholding-20283-default-rtdb.firebaseio.com",
            projectId: "azhunholding-20283",
            storageBucket: "azhunholding-20283.firebasestorage.app",
            messagingSenderId: "525857337022",
            appId: "1:525857337022:web:d2c581cc707d270a7c3bef",
            measurementId: "G-GCJYX2WNKK"
        };

        // Firebase-i işə salırıq
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // UI Təzələmə
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                showTab('content'); // Default tab
                loadContent();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
            }
        });

        // Giriş
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = "Giriş edilir...";
            errorMsg.classList.add('hidden');

            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => {
                    btn.disabled = false;
                    btn.innerText = "Daxil Ol";
                    errorMsg.innerText = "Xəta: Email və ya şifrə yanlışdır!";
                    errorMsg.classList.remove('hidden');
                });
        });

        // Çıxış
        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => location.reload());
        });

        // Tab keçidləri
        function showTab(tab) {
            const tabs = ['content', 'products', 'moderators'];
            tabs.forEach(t => document.getElementById(t + '-tab').classList.add('hidden'));
            document.getElementById(tab + '-tab').classList.remove('hidden');
            
            // Sidebar active style
            const buttons = document.querySelectorAll('aside nav button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-slate-800');
                if (btn.getAttribute('onclick').includes(`'${tab}'`)) {
                    btn.classList.add('bg-slate-800');
                }
            });

            const titles = {
                'content': 'Məzmun İdarəetməsi',
                'products': 'Məhsullar İdarəetməsi',
                'moderators': 'Moderatorlar'
            };
            document.getElementById('tab-title').innerText = titles[tab];
            
            if (tab === 'products') loadProducts();
        }

        // Məzmunu Yüklə
        function loadContent() {
            db.ref('site_content').once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('db-hero-title').value = data.hero_title || '';
                    document.getElementById('db-hero-subtitle').value = data.hero_subtitle || '';
                    document.getElementById('db-about-title').value = data.about_title || '';
                    document.getElementById('db-about-text-1').value = data.about_text_1 || '';
                }
            });
        }

        // Məzmunu Yadda Saxla
        document.getElementById('save-content').addEventListener('click', () => {
            const updates = {
                hero_title: document.getElementById('db-hero-title').value,
                hero_subtitle: document.getElementById('db-hero-subtitle').value,
                about_title: document.getElementById('db-about-title').value,
                about_text_1: document.getElementById('db-about-text-1').value
            };
            db.ref('site_content').update(updates)
                .then(() => alert('Uğurla yadda saxlanıldı!'))
                .catch(err => alert('Xəta: ' + err.message));
        });

        // Məhsulları Yüklə
        function loadProducts() {
            db.ref('products').on('value', snapshot => {
                const list = document.getElementById('products-list');
                list.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    list.innerHTML = '<p class="text-slate-400 italic text-sm">Hələ məhsul yoxdur.</p>';
                    return;
                }
                Object.keys(data).forEach(id => {
                    const p = data[id];
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="flex items-center gap-4">
                                <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover bg-slate-200">
                                <div>
                                    <h4 class="font-bold text-slate-800">${p.name}</h4>
                                    <p class="text-xs text-slate-500">${p.desc ? p.desc.substring(0, 50) + '...' : ''}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editProduct('${id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-all"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteProduct('${id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-all"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // Məhsul Sil
        window.deleteProduct = (id) => {
            if (confirm('Silsin?')) db.ref('products/' + id).remove();
        };

        // Məhsul Redaktə
        window.editProduct = (id) => {
            db.ref('products/' + id).once('value', snapshot => {
                const p = snapshot.val();
                document.getElementById('product-id').value = id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-desc').value = p.desc;
                document.getElementById('prod-image').value = p.image;
                document.getElementById('cancel-edit').classList.remove('hidden');
                document.getElementById('save-product').innerText = 'Yenilə';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        };

        // Məhsul Yadda Saxla
        document.getElementById('save-product').addEventListener('click', () => {
            const id = document.getElementById('product-id').value;
            const data = {
                name: document.getElementById('prod-name').value,
                desc: document.getElementById('prod-desc').value,
                image: document.getElementById('prod-image').value
            };
            if (!data.name || !data.image) return alert('Ad və Şəkil vacibdir!');
            const ref = id ? db.ref('products/' + id) : db.ref('products').push();
            ref.set(data).then(() => {
                resetProductForm();
                alert('Məlumat yeniləndi!');
            });
        });

        document.getElementById('cancel-edit').addEventListener('click', resetProductForm);

        function resetProductForm() {
            document.getElementById('product-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-desc').value = '';
            document.getElementById('prod-image').value = '';
            document.getElementById('cancel-edit').classList.add('hidden');
            document.getElementById('save-product').innerText = 'Yadda Saxla';
        }

        // Moderator Yarat
        document.getElementById('add-mod').addEventListener('click', () => {
            const email = document.getElementById('new-mod-email').value;
            const pass = document.getElementById('new-mod-password').value;
            if (!email || !pass) return alert('Məlumatları doldurun!');
            
            // Firebase Auth-da yaratmaq üçün secondary app və ya admin sdk lazımdır,
            // lakin biz sadəcə bazaya qeyd edə bilərik (və ya Firebase Console-dan manual əlavə edilməlidir).
            alert('Yeni moderator Firebase Console-dan "Authentication" bölməsindən əlavə edilməlidir.');
        });
    </script>
</body>
</html>
